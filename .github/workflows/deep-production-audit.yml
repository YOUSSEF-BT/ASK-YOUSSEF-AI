name: Deep production audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend/**"
      - "scripts/enrich_public_contact.py"
      - "scripts/enrich_career_status.py"
      - "evaluation/deep_audit_cases.json"
      - "vercel.json"
      - "requirements.txt"
      - ".github/workflows/deep-production-audit.yml"

permissions:
  contents: read

concurrency:
  group: deep-production-audit
  cancel-in-progress: true

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Allow the Git-connected Vercel production deployment for this commit to
      # become READY before exercising the canonical production alias.
      - name: Wait for Vercel production deployment
        run: sleep 75

      - name: Run adversarial deployed audit
        run: |
          python evaluation/run_online_eval.py \
            --api-url "https://ask-youssef-ai.vercel.app" \
            --origin "https://youssef-bt.github.io" \
            --dataset evaluation/deep_audit_cases.json \
            --output deep-audit-report.json \
            --delay 11 \
            --retries 2 \
            --strict

      - name: Publish deep audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-production-audit-report
          path: deep-audit-report.json
          if-no-files-found: warn
          retention-days: 14

# Final production validation trigger; no thresholds or test logic changed.
