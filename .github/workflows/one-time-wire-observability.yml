name: One-time wire runtime observability

on:
  push:
    branches: [main]
    paths:
      - "scripts/wire_runtime_observability.py"
      - ".github/workflows/one-time-wire-observability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire runtime observability
        run: python scripts/wire_runtime_observability.py

      - name: Compile, test, and benchmark
        run: |
          python -m compileall -q backend scripts tests evaluation
          python -m unittest discover -s tests -p "test_*.py" -v
          python evaluation/run_benchmark.py --strict --output /tmp/portfolio-benchmark.json

      - name: Commit observability integration
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add backend/app.py
          if git diff --cached --quiet; then
            echo "Runtime observability already integrated."
          else
            git commit -m "Add privacy-safe runtime observability"
            git push origin main
          fi
