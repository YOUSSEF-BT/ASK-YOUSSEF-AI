name: Bootstrap Ask Youssef AI foundation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-foundation.yml"
      - "scripts/bootstrap_foundation.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch bootstrap host normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/bootstrap_foundation.py')
          text = p.read_text()
          needle = "        ('https://adityajain.me', 'https://youssef-bt.github.io'),\n"
          replacement = needle + "        ('adityajain.me', 'youssef-bt.github.io'),\n"
          if "('adityajain.me', 'youssef-bt.github.io')" not in text:
              if needle not in text:
                  raise SystemExit('Expected replacement anchor not found')
              text = text.replace(needle, replacement, 1)
              p.write_text(text)
          PY

      - name: Prepare professional foundation
        run: python scripts/bootstrap_foundation.py

      - name: Commit verified foundation
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No foundation changes to commit."
          else
            git commit -m "Bootstrap Ask Youssef AI professional foundation"
            git push origin main
          fi
