name: Bootstrap Ask Youssef AI foundation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-foundation.yml"
      - "scripts/bootstrap_foundation.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch bootstrap normalization and attribution whitelist
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/bootstrap_foundation.py')
          text = p.read_text()

          host_anchor = '        ("https://adityajain.me", "https://youssef-bt.github.io"),\n'
          host_line = '        ("adityajain.me", "youssef-bt.github.io"),\n'
          if host_line.strip() not in text:
              if host_anchor not in text:
                  raise SystemExit('Expected host replacement anchor not found')
              text = text.replace(host_anchor, host_anchor + host_line, 1)

          old_scan = '    scan_targets = [ROOT / "backend", ROOT / "web", ROOT / ".github/workflows", ROOT / "README.md", ROOT / "render.yaml"]\n'
          new_scan = '    scan_targets = [ROOT / "backend", ROOT / "web", ROOT / ".github/workflows", ROOT / "render.yaml"]\n'
          if old_scan in text:
              text = text.replace(old_scan, new_scan, 1)

          p.write_text(text)
          PY

      - name: Prepare professional foundation
        run: python scripts/bootstrap_foundation.py

      - name: Commit verified foundation
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/ci.yml .github/workflows/crawl.yml .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "No foundation changes to commit."
          else
            git commit -m "Bootstrap Ask Youssef AI professional foundation"
            git push origin main
          fi
