name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/data/site/**"
      - "backend/data/embcache/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall -q backend scripts tests evaluation

      - name: Run deterministic retrieval tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate knowledge and evaluation JSON
        run: |
          python -m json.tool evaluation/dataset.json >/dev/null
          python -m json.tool evaluation/online_cases.json >/dev/null
          python -m json.tool backend/data/profile.json >/dev/null
          python -m json.tool backend/data/site/manifest.json >/dev/null

      - name: Run portfolio quality benchmark
        run: python evaluation/run_benchmark.py --strict --output portfolio-benchmark.json

      - name: Publish deterministic benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-portfolio-benchmark
          path: portfolio-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify required project files
        run: |
          test -f LICENSE
          test -f NOTICE.md
          test -f .env.example
          test -f backend/app.py
          test -f backend/agent.py
          test -f backend/rag.py
          test -f backend/grounding.py
          test -f backend/router.py
          test -f backend/observability.py
          test -f backend/retrieval/hybrid.py
          test -f backend/retrieval/structured.py
          test -f backend/data/profile.json
          test -f scripts/sync_portfolio.py
          test -f scripts/build_structured_profile.py
          test -f evaluation/run_benchmark.py
          test -f evaluation/run_online_eval.py
          test -f evaluation/online_cases.json
          test -f .github/workflows/online-eval.yml
          test -f tests/test_runtime_wiring.py
          test -f tests/test_observability.py
          test -f tests/test_online_eval.py
          test -f web/widget.js
          test -f docs/architecture.md
          test -f docs/evaluation.md

      - name: Validate synchronized profile counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path("backend/data/profile.json").read_text())
          manifest = json.loads(Path("backend/data/site/manifest.json").read_text())
          checks = {
              "projects": len(profile.get("projects", [])),
              "skill_categories": len(profile.get("skill_categories", [])),
              "certifications": len(profile.get("certifications", [])),
              "work_experiences": len(profile.get("work_experiences", [])),
              "education_entries": len(profile.get("education", [])),
          }
          for key, value in checks.items():
              if value < 1:
                  raise SystemExit(f"Structured profile missing {key}")
              if value != int(manifest.get(key, -1)):
                  raise SystemExit(f"Profile/manifest mismatch for {key}: {value} != {manifest.get(key)}")
          print("Synchronized profile counts validated:", checks)
          PY

      - name: Guard against stale upstream identity data
        run: |
          if grep -R -n --exclude='LICENSE' --exclude='NOTICE.md' --exclude='README.md' -E 'adityajain\.me|Aditya Jain|Ask about Aditya|Chat with Aditya' backend web render.yaml .env.example; then
            echo "Stale upstream identity reference found."
            exit 1
          fi
