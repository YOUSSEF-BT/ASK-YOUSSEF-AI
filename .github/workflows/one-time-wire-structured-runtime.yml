name: One-time wire structured retrieval runtime

on:
  push:
    branches: [main]
    paths:
      - "scripts/wire_structured_runtime.py"
      - ".github/workflows/one-time-wire-structured-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire structured retrieval runtime
        run: python scripts/wire_structured_runtime.py

      - name: Compile and run deterministic tests
        run: |
          python -m compileall -q backend scripts tests evaluation
          python -m unittest discover -s tests -p "test_*.py" -v
          python evaluation/run_benchmark.py --strict --output /tmp/portfolio-benchmark.json

      - name: Commit runtime integration
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add backend/app.py
          if git diff --cached --quiet; then
            echo "Structured runtime wiring already present."
          else
            git commit -m "Use structured retrieval in production runtime"
            git push origin main
          fi
