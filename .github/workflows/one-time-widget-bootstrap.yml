name: One-time widget bootstrap fix

on:
  push:
    paths:
      - ".github/workflows/one-time-widget-bootstrap.yml"
      - "scripts/fix_widget_bootstrap.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix widget bootstrap order
        run: python scripts/fix_widget_bootstrap.py
      - name: Validate widget syntax
        run: node --check web/widget.js
      - name: Commit fix
        run: |
          git config user.name "Youssef Bouzit"
          git config user.email "bt.youssef.369@gmail.com"
          git add web/widget.js
          git commit -m "Fix premium widget bootstrap order"
          git push
