name: One-time runtime hardening

on:
  push:
    paths:
      - ".github/workflows/one-time-runtime-hardening.yml"
      - "scripts/harden_runtime.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply runtime hardening
        run: python scripts/harden_runtime.py
      - name: Compile changed Python
        run: python -m compileall -q backend
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Youssef Bouzit"
          git config user.email "bt.youssef.369@gmail.com"
          git add backend/app.py backend/agent.py backend/rag.py
          git commit -m "Harden production API boundaries and runtime docs"
          git push
