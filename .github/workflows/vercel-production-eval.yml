name: Vercel production evaluation

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend/**"
      - "scripts/enrich_public_contact.py"
      - "scripts/enrich_career_status.py"
      - "vercel.json"
      - "requirements.txt"
      - "evaluation/**"
      - ".github/workflows/vercel-production-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for exact Vercel production commit
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          expected = os.environ["GITHUB_SHA"]
          url = "https://ask-youssef-ai.vercel.app/deployment"
          headers = {
              "Accept": "application/json",
              "Origin": "https://youssef-bt.github.io",
              "Cache-Control": "no-cache",
          }

          last = None
          for attempt in range(1, 37):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  last = payload
                  deployed = str(payload.get("commit") or "")
                  environment = str(payload.get("environment") or "")
                  print(
                      f"attempt={attempt} expected={expected[:12]} "
                      f"deployed={deployed[:12] or 'missing'} env={environment or 'unknown'}"
                  )
                  if deployed == expected and environment == "production":
                      print("Exact Vercel production commit is active.")
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError) as exc:
                  print(f"attempt={attempt} deployment metadata unavailable: {exc}")
              time.sleep(10)
          else:
              raise SystemExit(
                  f"Vercel production did not promote {expected} within the wait window; "
                  f"last deployment metadata={last!r}"
              )
          PY

      - name: Validate production health
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://ask-youssef-ai.vercel.app/health"
          req = urllib.request.Request(url, headers={
              "Accept": "application/json",
              "Origin": "https://youssef-bt.github.io",
          })
          with urllib.request.urlopen(req, timeout=180) as response:
              health = json.loads(response.read().decode("utf-8"))
          print(json.dumps(health, indent=2))
          if not health.get("ok"):
              raise SystemExit("Production health check failed")
          PY

      - name: Run deployed career-state regression
        run: |
          python evaluation/run_online_eval.py \
            --api-url "https://ask-youssef-ai.vercel.app" \
            --origin "https://youssef-bt.github.io" \
            --dataset evaluation/career_cases.json \
            --output career-eval-report.json \
            --strict

      - name: Cool down between production suites
        run: sleep 30

      - name: Run strict core production regression
        run: |
          python evaluation/run_online_eval.py \
            --api-url "https://ask-youssef-ai.vercel.app" \
            --origin "https://youssef-bt.github.io" \
            --dataset evaluation/core_production_cases.json \
            --output online-eval-report.json \
            --strict

      - name: Publish production evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vercel-production-eval-report
          path: |
            online-eval-report.json
            career-eval-report.json
          if-no-files-found: warn
          retention-days: 14
