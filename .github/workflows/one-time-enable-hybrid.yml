name: One-time enable hybrid retrieval

on:
  push:
    branches: [main]
    paths:
      - "scripts/enable_hybrid_retrieval.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hybrid retrieval integration
        run: python scripts/enable_hybrid_retrieval.py

      - name: Verify Python syntax
        run: python -m compileall -q backend

      - name: Commit integration
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add backend/app.py backend/mcp_server/blog_server.py README.md docs/architecture.md
          git commit -m "Integrate hybrid retrieval into agent search"
          git push origin main
