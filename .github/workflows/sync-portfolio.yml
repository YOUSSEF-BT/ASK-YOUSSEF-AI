name: Sync portfolio knowledge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_portfolio.py"
      - "scripts/build_structured_profile.py"
      - "scripts/enrich_public_contact.py"
      - ".github/workflows/sync-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: sync-portfolio-knowledge
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Ask Youssef AI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout portfolio source
        run: git clone --depth 1 https://github.com/YOUSSEF-BT/YOUSSEF-BT.github.io.git /tmp/youssef-portfolio

      - name: Build synchronized knowledge corpus
        run: python scripts/sync_portfolio.py --source /tmp/youssef-portfolio --output backend/data/site

      - name: Build structured professional profile
        run: python scripts/build_structured_profile.py --source /tmp/youssef-portfolio --output backend/data/profile.json

      - name: Enrich public contact evidence
        run: |
          python scripts/enrich_public_contact.py \
            --source /tmp/youssef-portfolio \
            --site backend/data/site \
            --profile backend/data/profile.json

      - name: Validate synchronized knowledge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("backend/data/site")
          manifest = json.loads((root / "manifest.json").read_text())
          profile = json.loads(Path("backend/data/profile.json").read_text())
          required = {
              "projects": 1,
              "skill_categories": 1,
              "certifications": 1,
              "work_experiences": 1,
              "education_entries": 1,
              "public_links": 1,
          }
          for key, minimum in required.items():
              value = int(manifest.get(key, 0))
              if value < minimum:
                  raise SystemExit(f"Incomplete synchronized corpus: {key}={value}")

          markdown = list(root.glob("*.md"))
          if len(markdown) < 5:
              raise SystemExit(f"Expected at least 5 knowledge documents, found {len(markdown)}")

          profile_checks = {
              "projects": len(profile.get("projects", [])),
              "skill_categories": len(profile.get("skill_categories", [])),
              "certifications": len(profile.get("certifications", [])),
              "work_experiences": len(profile.get("work_experiences", [])),
              "education": len(profile.get("education", [])),
              "public_links": len(profile.get("public_links", [])),
          }
          if any(value < 1 for value in profile_checks.values()):
              raise SystemExit(f"Incomplete structured profile: {profile_checks}")
          if profile_checks["projects"] != manifest["projects"]:
              raise SystemExit("Structured profile project count does not match corpus manifest")
          if profile_checks["certifications"] != manifest["certifications"]:
              raise SystemExit("Structured profile certification count does not match corpus manifest")
          if profile_checks["public_links"] != manifest["public_links"]:
              raise SystemExit("Structured profile public-link count does not match corpus manifest")

          public_emails = [
              row.get("value")
              for row in profile.get("public_links", [])
              if isinstance(row, dict) and row.get("label") == "Email" and row.get("value")
          ]
          if not public_emails:
              raise SystemExit("Public portfolio email was not synchronized into structured profile")
          public_links_text = (root / "public-links.md").read_text(encoding="utf-8")
          if not all(email in public_links_text for email in public_emails):
              raise SystemExit("Public email is missing from public-links.md")

          print("Validated manifest:", manifest)
          print("Validated structured profile:", profile_checks)
          print("Public email evidence:", public_emails)
          print("Knowledge documents:", len(markdown))
          PY

      - name: Commit portfolio knowledge changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add backend/data/site backend/data/profile.json
          if git diff --cached --quiet; then
            echo "Portfolio knowledge is already up to date."
          else
            git commit -m "Sync portfolio knowledge"
            git push origin main
          fi
