name: One-time enable grounding verifier

on:
  push:
    branches: [main]
    paths:
      - "scripts/enable_grounding_stream.py"
      - ".github/workflows/one-time-grounding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch final answer stream
        run: python scripts/enable_grounding_stream.py

      - name: Compile patched backend
        run: python -m compileall -q backend

      - name: Commit integration
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add backend/app.py
          if git diff --cached --quiet; then
            echo "No grounding integration change to commit."
          else
            git commit -m "Enforce grounding on final chat answers"
            git push origin main
          fi
