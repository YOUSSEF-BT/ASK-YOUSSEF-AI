services:
  ask-youssef-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: ask-youssef-ai:local
    env_file:
      - .env
    environment:
      PORT: "8000"
      MCP_TRANSPORT: inprocess
      CRAWL_SITES: ""
      CORPUS_DIR: /app/backend/data/site
      EMBEDDER: fastembed
      FASTEMBED_MODEL: BAAI/bge-small-en-v1.5
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8000
    ports:
      - "8000:8000"
    restart: unless-stopped
